name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Verify release-ref policy
        run: |
          git tag m11.2-test "$GITHUB_SHA"
          if sh scripts/verify-release-ref.sh m11.2-test "$GITHUB_SHA"; then
            echo "non-SemVer tag unexpectedly accepted" >&2
            exit 1
          fi
          git tag v0.0.0-m11.2 "$GITHUB_SHA"
          sh scripts/verify-release-ref.sh v0.0.0-m11.2 "$GITHUB_SHA"
          if sh scripts/verify-release-ref.sh v0.0.0-m11.2 0000000000000000000000000000000000000000; then
            echo "tag/commit mismatch unexpectedly accepted" >&2
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build amd64 image
        run: |
          docker build \
            --build-arg VERSION=ci \
            --build-arg REVISION="$GITHUB_SHA" \
            -t soju:ci .

      - name: Verify non-root runtime
        run: |
          test "$(docker run --rm --entrypoint id soju:ci -u)" = "1000"
          test "$(docker run --rm --entrypoint id soju:ci -g)" = "1000"

      - name: Verify OCI metadata
        run: |
          test "$(docker image inspect soju:ci --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')" = "https://github.com/Ploos-AS/soju"
          test "$(docker image inspect soju:ci --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}')" = "AGPL-3.0-only"
          test "$(docker image inspect soju:ci --format '{{ index .Config.Labels "io.ploos.soju.upstream.commit" }}')" = "8bff925bd7b952babe085eedac6c5f9eb68e39c5"

      - name: Verify binaries
        run: |
          docker run --rm --entrypoint /usr/local/bin/soju soju:ci -h >/dev/null
          docker run --rm --entrypoint /usr/local/bin/sojudb soju:ci -h >/dev/null 2>&1 || test "$?" -eq 2

      - name: Verify persistent database and admin socket startup
        run: |
          mkdir -p data-test run-test
          sudo chown 1000:1000 data-test run-test
          cid=$(docker run -d --rm \
            -v "$PWD/data-test:/var/lib/soju" \
            -v "$PWD/run-test:/run/soju" \
            soju:ci)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 20); do
            if docker ps --filter "id=$cid" --format '{{.ID}}' | grep -q . \
              && test -f data-test/main.db \
              && test -S run-test/admin; then
              break
            fi
            sleep 1
          done
          docker ps --filter "id=$cid" --format '{{.ID}}' | grep -q .
          test -f data-test/main.db
          test -S run-test/admin
          docker rm -f "$cid"
          trap - EXIT

      - name: Build arm64 image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --build-arg VERSION=ci \
            --build-arg REVISION="$GITHUB_SHA" \
            --load \
            -t soju:ci-arm64 .

      - name: Verify arm64 binary starts
        run: docker run --rm --platform linux/arm64 --entrypoint /usr/local/bin/soju soju:ci-arm64 -h >/dev/null
